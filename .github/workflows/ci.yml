# CI: lint, kit self-checks on both PowerShell engines, and security scanning.
# Runs on every pull request and on pushes to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Settings .\PSScriptAnalyzerSettings.psd1 -Recurse
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 300 | Write-Host
          if (@($results | Where-Object Severity -in @('Error','Warning')).Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $(@($results).Count) issue(s)."
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: clean.'

  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # The self-checks are a Pester 5 suite (tests\Kit.Tests.ps1). Pester is
      # a CI/dev dependency only; the kit itself needs no modules. Each engine
      # has its own module path, so install it for both.
      - name: Install Pester 5 (Windows PowerShell 5.1)
        shell: powershell
        run: Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Install Pester 5 (PowerShell 7)
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck

      # The kit must run on stock Windows PowerShell 5.1 - test that engine first.
      - name: Kit checks (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\Invoke-KitChecks.ps1

      - name: Kit checks (PowerShell 7)
        shell: pwsh
        run: .\tests\Invoke-KitChecks.ps1

  security:
    name: security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # DevSkim covers PowerShell; findings appear under the repo's Security tab.
      - name: DevSkim scan
        uses: microsoft/DevSkim-Action@v1

      - name: Upload DevSkim results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: devskim-results.sarif
