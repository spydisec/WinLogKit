# Docs: build the MkDocs Material site and deploy to GitHub Pages (gh-pages
# branch) on doc changes landing in main.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: build and deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build and deploy
        run: |
          pip install mkdocs-material
          mkdocs build --strict
          mkdocs gh-deploy --force
