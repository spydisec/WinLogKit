site_name: WinLogKit
site_description: >-
  Enable, verify, collect and deploy Windows event logging baselines with
  plain PowerShell - no modules, no agents.
site_url: https://spydisec.github.io/WinLogKit/
repo_url: https://github.com/spydisec/WinLogKit
repo_name: spydisec/WinLogKit

theme:
  name: material
  icon:
    logo: material/shield-search
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Ordered as a reader journey: try it, pick a baseline, look up commands,
# collect it, roll it out, measure it, stay safe.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Baselines: baselines.md
  - Commands: commands.md
  - Collect: wec.md
  - Deploy: deployment.md
  - Coverage: mapping.md
  - Reference: reference.md
  - Safety & FAQ: safety.md
  - Add-ons: addons.md
