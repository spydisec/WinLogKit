site_name: WinLogKit
site_description: >-
  Turn on the native Windows event logging security monitoring needs, prove
  it is recording, and undo it. Plain PowerShell - no modules, no agents,
  no downloads.
site_url: https://spydisec.github.io/WinLogKit/
repo_url: https://github.com/spydisec/WinLogKit
repo_name: spydisec/WinLogKit

theme:
  name: material
  icon:
    logo: material/shield-search
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode

# Architecture decision records live in the repo (docs/adr/), not on the site.
exclude_docs: |
  adr/

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Ordered as a user's path: try it, pick a baseline, roll it out, collect
# it; then look things up; then who made it possible.
nav:
  - Home: index.md
  - Get started: getting-started.md
  - Baselines: baselines.md
  - Deploy:
      - Overview: deployment.md
      - Intune Settings catalog: intune-csp.md
      - Group Policy paths: gpo-paths.md
  - Collect: wec.md
  - Reference:
      - Commands: commands.md
      - Settings: reference.md
      - Coverage: mapping.md
  - Safety & FAQ: safety.md
  - Credits: credits.md