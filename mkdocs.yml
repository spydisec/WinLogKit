site_name: WinLogKit
site_description: >-
  Implement the Yamato Security Windows event logging baselines with native
  PowerShell - enable, verify, roll back, and deploy at fleet scale.
site_url: https://spydisec.github.io/WinLogKit/
repo_url: https://github.com/spydisec/WinLogKit
repo_name: spydisec/WinLogKit

theme:
  name: material
  icon:
    logo: material/shield-search
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight

# Ordered as a reader journey: try it, pick a baseline, look up commands,
# roll it out, measure it, understand it, stay safe, get unstuck.
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Baselines: baselines.md
  - Commands: commands.md
  - Deployment: deployment.md
  - Coverage: mapping.md
  - Architecture: architecture.md
  - Safety: safety.md
  - FAQ: faq.md
